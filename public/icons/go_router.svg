<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27B0F0"/>
      <stop offset="1" stop-color="#0553B1"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3F2FD"/>
    </linearGradient>
  </defs>

  <!-- background rounded square -->
  <rect x="0" y="0" width="240" height="240" rx="48" fill="url(#bgGrad)"/>

  <!-- winding route path -->
  <path d="M40 190 C 70 190, 70 140, 100 140 C 130 140, 130 95, 160 95 C 178 95, 186 90, 192 78"
        stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M40 190 C 70 190, 70 140, 100 140 C 130 140, 130 95, 160 95 C 178 95, 186 90, 192 78"
        stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16" fill="none"/>

  <!-- start node -->
  <circle cx="40" cy="190" r="10" fill="#FFFFFF"/>

  <!-- destination pin -->
  <g transform="translate(192,44)">
    <path d="M0 0 C -18 0 -32 14 -32 32 C -32 54 0 78 0 78 C 0 78 32 54 32 32 C 32 14 18 0 0 0 Z"
          fill="url(#pinGrad)"/>
    <circle cx="0" cy="32" r="13" fill="#0553B1"/>
  </g>
</svg>
